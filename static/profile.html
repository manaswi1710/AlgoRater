<!DOCTYPE html>
<html>

<head>

<title>DSA Arena Profile</title>

<link rel="stylesheet" href="/css/styles.css">

</head>


<body>


<nav class="navbar">

<h1>DSA ARENA</h1>


<div class="nav-links">

<a href="/arena">Home</a>

<a href="/contests">Contests</a>

<a href="/leaderboard">Rankings</a>

</div>

</nav>



<div class="container">
<div class="profile-wrapper">

<div class="profile-card">


<h2 id="username">
Loading...
</h2>


<div class="profile-info">

<span>Codeforces</span>

<span id="cf"></span>

</div>



<div class="profile-info">

<span>Rating</span>

<span id="rating"></span>

</div>



<div class="profile-info">

<span>Peak Rating</span>

<span id="peak"></span>

</div>



<div class="profile-info">

<span>Rank</span>

<span id="rank"></span>

</div>



<div class="profile-info">

<span>Solved Problems</span>

<span id="solved"></span>

</div>

<h2> Match Statistics</h2>

<div class="profile-info">
<span>Total Matches</span>
<span id="matches"></span>
</div>




<div class="profile-info">
<span>Wins</span>
<span id="wins"></span>
</div>


<div class="profile-info">
<span>Win Rate</span>
<span id="winrate"></span>
</div>


<h2>Recent Matches</h2>

<table class="cp-table">

<thead>
<tr>
<th>Problem</th>
<th>Verdict</th>
<th>Change</th>
</tr>
</thead>

<tbody id="history">

</tbody>

</table>

<h2> Rating Progress</h2>

<canvas id="ratingChart" height="120"></canvas>

<h2>Activity Heat Map</h2>


<div class="heatmap-wrapper">

<div class="month-labels">
    <span>Sep</span>
    <span>Oct</span>
    <span>Nov</span>
    <span>Dec</span>
    <span>Jan</span>
    <span>Feb</span>
    <span>Mar</span>
    <span>Apr</span>
    <span>May</span>
    <span>Jun</span>
    <span>Jul</span>
    <span>Aug</span>
</div>


    <div class="heatmap-area">


        <div class="weekday-labels">

            <span></span>
            <span>Mon</span>
            <span></span>
            <span>Wed</span>
            <span></span>
            <span>Fri</span>
            <span></span>

        </div>


        <div id="heatmap" class="heatmap-grid"></div>


    </div>


    <div class="heatmap-legend">

        <span>Less</span>

        <div class="legend-box"></div>
        <div class="legend-box level1"></div>
        <div class="legend-box level2"></div>
        <div class="legend-box level3"></div>
        <div class="legend-box level4"></div>

        <span>More</span>

    </div>


</div>
</div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="/js/profile.js"></script>


</body>

</html>
